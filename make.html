<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Link Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #ededed;
    --muted: #a1a1a1;
    --border: #2e2e2e;
    --grid: #1c1c1c;
    --pill: #1a1a1a;
    --error: #ff6166;
    --ok: #62c073;
    --cell: 120px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fff;
      --fg: #171717;
      --muted: #666;
      --border: #eaeaea;
      --grid: #efefef;
      --pill: #f5f5f5;
      --error: #d93036;
      --ok: #2a8a3e;
    }
  }
  @media (max-width: 640px) {
    :root { --cell: 56px; }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }

  /* Riquadro con la griglia */
  .frame {
    position: relative;
    width: min(calc(var(--cell) * 9), 100%);
    min-height: calc(var(--cell) * 5);
    border-right: 1px solid var(--grid);
    border-bottom: 1px solid var(--grid);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    padding: var(--cell) 0 calc(var(--cell) * 0.75);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    margin-bottom: 24px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    background: var(--pill);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .arrow { color: var(--muted); font-family: "Geist Mono", monospace; font-size: 13px; }

  h1 {
    font-size: clamp(44px, 10vw, 112px);
    font-weight: 600;
    letter-spacing: -0.055em;
    line-height: 0.95;
    margin: 0 0 20px -0.04em;
  }
  p.lead {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 32px;
    max-width: 440px;
  }

  .stack { max-width: 560px; display: grid; gap: 12px; }

  label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  .field {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within {
    border-color: var(--muted);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--fg) 12%, transparent);
  }
  .field.error { border-color: var(--error); }
  .field input, .field output {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: 0;
    color: var(--fg);
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 13px;
    padding: 10px 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .field input::placeholder { color: var(--muted); opacity: .6; }

  button {
    font-family: "Geist", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity .15s, background .15s, color .15s;
  }
  .clear {
    background: none;
    border: 0;
    color: var(--muted);
    padding: 0 12px;
    height: 38px;
    font-size: 16px;
  }
  .clear:hover { color: var(--fg); }
  .copy {
    background: var(--fg);
    color: var(--bg);
    border: 0;
    margin: 4px;
    padding: 0 14px;
    height: 30px;
    white-space: nowrap;
  }
  .copy:hover { opacity: .85; }
  .copy.done { background: var(--ok); color: #fff; }

  .msg {
    font-size: 13px;
    min-height: 20px;
    margin: 0;
    color: var(--muted);
  }
  .msg.error { color: var(--error); }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin: 20px 0 0;
  }
  .hint a { color: var(--muted); }
  .hint a:hover { color: var(--fg); }
  kbd {
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    background: var(--pill);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="badge">
    <span class="chip">YouTube</span>
    <span class="arrow">→</span>
    <span class="chip">Cosmos</span>
  </div>

  <h1>Link maker</h1>
  <p class="lead">Paste a YouTube link, get the source link for Cosmos. It's copied automatically.</p>

  <div class="stack">
    <div>
      <label for="in">YouTube link</label>
      <div class="field" id="inField">
        <input id="in" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false" autofocus>
        <button class="clear" id="clear" type="button" aria-label="Clear" hidden>×</button>
      </div>
    </div>

    <div id="outWrap" hidden>
      <label for="out">Cosmos source</label>
      <div class="field">
        <output id="out"></output>
        <button class="copy" id="copy" type="button">Copy</button>
      </div>
    </div>

    <p class="msg" id="msg"></p>
  </div>

  <p class="hint"><kbd>Ctrl</kbd> + <kbd>V</kbd> anywhere on the page · <a id="test" href="#" target="_blank" rel="noopener" hidden>Test link ↗</a></p>
</div>

<script>
  // Indirizzo della pagina di redirect
  var BASE = "https://anostefano.github.io/r/";

  var input = document.getElementById("in");
  var inField = document.getElementById("inField");
  var outWrap = document.getElementById("outWrap");
  var out = document.getElementById("out");
  var copyBtn = document.getElementById("copy");
  var clearBtn = document.getElementById("clear");
  var msg = document.getElementById("msg");
  var test = document.getElementById("test");

  // Converte "90", "90s", "1m30s", "1h2m3s" in secondi
  function toSeconds(t) {
    if (!t) return "";
    if (/^\d+s?$/.test(t)) return String(parseInt(t, 10));
    var m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
    if (!m || !(m[1] || m[2] || m[3])) return "";
    return String((+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0));
  }

  // Estrae ID video e tempo di inizio da qualsiasi formato di link YouTube
  function parse(raw) {
    var s = raw.trim();
    if (!s) return null;
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return { id: s, t: "" };
    if (!/^https?:\/\//i.test(s)) s = "https://" + s;

    var u;
    try { u = new URL(s); } catch (e) { return null; }

    var host = u.hostname.replace(/^(www|m|music)\./, "");
    var id = "";

    if (host === "youtu.be") {
      id = u.pathname.split("/")[1] || "";
    } else if (host === "youtube.com" || host === "youtube-nocookie.com") {
      if (u.pathname === "/watch") {
        id = u.searchParams.get("v") || "";
      } else {
        var m = u.pathname.match(/^\/(shorts|embed|live|v)\/([^/?#]+)/);
        if (m) id = m[2];
      }
    } else if (host === "anostefano.github.io") {
      id = u.searchParams.get("v") || "";
    }

    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return null;

    var t = u.searchParams.get("t") || u.searchParams.get("start") || "";
    if (!t && u.hash) {
      var h = u.hash.match(/t=([0-9hms]+)/);
      if (h) t = h[1];
    }
    return { id: id, t: toSeconds(t) };
  }

  function build(r) {
    var link = BASE + "?v=" + r.id;
    if (r.t && r.t !== "0") link += "&t=" + r.t;
    return link;
  }

  function copy(text) {
    function ok() {
      copyBtn.textContent = "Copied";
      copyBtn.classList.add("done");
      clearTimeout(copy._t);
      copy._t = setTimeout(function () {
        copyBtn.textContent = "Copy";
        copyBtn.classList.remove("done");
      }, 1500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, function () { fallback(text) && ok(); });
    } else if (fallback(text)) {
      ok();
    }
  }
  function fallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var res = false;
    try { res = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return res;
  }

  function update(autoCopy) {
    var raw = input.value;
    clearBtn.hidden = !raw;

    if (!raw.trim()) {
      outWrap.hidden = true;
      test.hidden = true;
      inField.classList.remove("error");
      msg.textContent = "";
      msg.classList.remove("error");
      return;
    }

    var r = parse(raw);
    if (!r) {
      outWrap.hidden = true;
      test.hidden = true;
      inField.classList.add("error");
      msg.textContent = "That doesn't look like a YouTube video link.";
      msg.classList.add("error");
      return;
    }

    var link = build(r);
    out.textContent = link;
    test.href = link;
    test.hidden = false;
    outWrap.hidden = false;
    inField.classList.remove("error");
    msg.classList.remove("error");
    msg.textContent = r.t ? "Starts at " + r.t + "s." : "";

    if (autoCopy) copy(link);
  }

  input.addEventListener("input", function (e) {
    // Copia automatica solo quando il link viene incollato
    update(e.inputType === "insertFromPaste");
  });

  // Incolla ovunque nella pagina, anche senza aver cliccato il campo
  document.addEventListener("paste", function (e) {
    if (document.activeElement === input) return;
    var text = (e.clipboardData || window.clipboardData).getData("text");
    if (!text) return;
    e.preventDefault();
    input.value = text.trim();
    input.focus();
    update(true);
  });

  copyBtn.addEventListener("click", function () { copy(out.textContent); });

  clearBtn.addEventListener("click", function () {
    input.value = "";
    update(false);
    input.focus();
  });
</script>
</body>
</html>
