<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #ededed;
    --muted: #a1a1a1;
    --border: #2e2e2e;
    --grid: #1c1c1c;
    --pill: #1a1a1a;
    --track: #1a1a1a;
    --cell: 120px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fff;
      --fg: #171717;
      --muted: #666;
      --border: #eaeaea;
      --grid: #efefef;
      --pill: #f5f5f5;
      --track: #f0f0f0;
    }
  }
  @media (max-width: 640px) {
    :root { --cell: 56px; }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }

  /* Riquadro con la griglia */
  .frame {
    position: relative;
    width: min(calc(var(--cell) * 9), 100%);
    min-height: calc(var(--cell) * 5);
    border-right: 1px solid var(--grid);
    border-bottom: 1px solid var(--grid);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    padding: var(--cell) 0 calc(var(--cell) * 0.75);
  }


  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 24px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--pill);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .arrow { color: var(--muted); font-family: "Geist Mono", monospace; font-size: 13px; }

  h1 {
    font-size: clamp(44px, 10vw, 112px);
    font-weight: 600;
    letter-spacing: -0.055em;
    line-height: 0.95;
    margin: 0 0 20px -0.04em;
  }
  p {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 32px;
    max-width: 440px;
  }
  .bar {
    height: 2px;
    max-width: 440px;
    background: var(--track);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .bar span { display: block; height: 100%; width: 0; background: var(--fg); }

  .dest {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .dest:hover { color: var(--fg); border-color: var(--muted); }
</style>
</head>
<body>
<div class="frame">

  <div class="badge">
    <span class="chip">
      Cosmos
    </span>
    <span class="arrow">→</span>
    <span class="chip">
      YouTube
    </span>
  </div>

  <h1>Not tracked lol</h1>
  <p id="msg">YouTube links in Cosmos are broken. For some reason, if I directly paste a YouTube link into the source tab, the content breaks. This is a workaround.</p>
  <div class="bar"><span id="progress"></span></div>
  <a class="dest" id="dest" hidden></a>
</div>

<script>
  // Tempo prima del redirect, in millisecondi
  var DELAY = 2800;

  var p = new URLSearchParams(location.search);
  var v = p.get("v") || "";
  var t = p.get("t") || "";

  // Accetta solo ID YouTube validi (11 caratteri), così la pagina
  // non può essere usata per reindirizzare verso siti qualsiasi.
  if (/^[A-Za-z0-9_-]{11}$/.test(v)) {
    var url = "https://www.youtube.com/watch?v=" + v;
    if (/^\d+$/.test(t)) url += "&t=" + t + "s";

    var dest = document.getElementById("dest");
    dest.href = url;
    dest.textContent = "→ youtube.com/watch?v=" + v;
    dest.hidden = false;

    var bar = document.getElementById("progress");
    bar.style.transition = "width " + DELAY + "ms linear";
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { bar.style.width = "100%"; });
    });

    setTimeout(function () { location.replace(url); }, DELAY);
  } else {
    document.querySelector("h1").textContent = "Invalid link";
    document.getElementById("msg").textContent = "This link doesn't point to a valid YouTube video.";
    document.querySelector(".bar").hidden = true;
  }
</script>
</body>
</html>
